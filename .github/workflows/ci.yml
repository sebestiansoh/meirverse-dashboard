# ============================================================================
# CI — required on every PR + push to main
# ============================================================================
# Per CLAUDE.md §Observability & CI ("GitHub Actions on every PR — lint, test,
# build. Required green checks before merge. No merge directly to main.")
#
# This workflow runs typecheck + lint + build in a single job (they share a
# node_modules so installing once is cheaper than three jobs).
#
# To enforce the "required green check before merge" rule, the Principal
# should set Branch protection on `main` in GitHub:
#   Settings → Branches → Branch protection rules → main →
#     ☑ Require status checks to pass before merging
#     ☑ Require branches to be up to date before merging
#     Required checks: ci / verify
#     ☑ Do not allow bypassing the above settings
# ============================================================================

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any in-flight CI for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Build needs these to import — values are placeholders for CI only
      # (the build doesn't actually call Supabase). Production values live
      # in Vercel env vars.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      SESSION_PASSWORD: ci-placeholder-session-password-at-least-32-chars-long
      NEXT_PUBLIC_SITE_URL: https://ci-placeholder.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
